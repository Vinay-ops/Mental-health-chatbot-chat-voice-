<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychologist Login - MindCare Navigator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.1) !important;
            backdrop-filter: blur(10px);
        }
        
        .navbar-brand {
            color: white !important;
            font-weight: 700;
        }
        
        .navbar-nav .nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: all 0.3s ease;
        }
        
        .navbar-nav .nav-link:hover {
            color: white !important;
        }
        
        .auth-container {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 450px;
            width: 100%;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-icon {
            font-size: 2.5rem;
            color: #764ba2;
            margin-bottom: 15px;
        }
        
        .auth-header h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: #666;
            font-size: 0.95rem;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }
        
        .btn-login:active {
            transform: translateY(0);
        }
        
        .btn-register {
            background: white;
            color: #764ba2;
            border: 2px solid #764ba2;
        }
        
        .btn-register:hover {
            background: #764ba2;
            color: white;
        }
        
        .auth-links {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .auth-links a {
            flex: 1;
        }
        
        .auth-links a button {
            width: 100%;
        }
        
        .auth-divider {
            text-align: center;
            margin: 20px 0;
            color: #999;
        }
        
        .role-toggle {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        
        .role-toggle a {
            color: #764ba2;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .role-toggle a:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
        
        .loading {
            display: none;
        }
        
        @media (max-width: 576px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">MindCare Navigator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="role-selection.html">Back</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i class="bi bi-stethoscope"></i>
                </div>
                <h2 id="authTitle">Psychologist Login</h2>
                <p>Manage your clients and provide support</p>
            </div>

            <div class="role-toggle">
                Not a psychologist? <a href="login.html?role=user">Login as User</a>
            </div>

            <form id="authForm">
                <div id="errorMessage" class="error-message d-none"></div>

                <!-- Name field (for register only) -->
                <div class="form-group d-none" id="nameGroup">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Dr. John Doe" autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="doctor@example.com" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>

                <!-- License number (for register only) -->
                <div class="form-group d-none" id="licenseGroup">
                    <label class="form-label" for="license">License/Credentials</label>
                    <input type="text" class="form-control" id="license" placeholder="Your professional credentials">
                </div>

                <button type="submit" class="btn btn-login" id="submitBtn">Login</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="auth-links">
                <a href="#" id="toggleLink"><button type="button" class="btn btn-register">Create Account</button></a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const backendBase = 'http://127.0.0.1:8002';
        let isLoginMode = true;

        const authForm = document.getElementById('authForm');
        const emailEl = document.getElementById('email');
        const passwordEl = document.getElementById('password');
        const nameEl = document.getElementById('name');
        const licenseEl = document.getElementById('license');
        const nameGroup = document.getElementById('nameGroup');
        const licenseGroup = document.getElementById('licenseGroup');
        const authTitle = document.getElementById('authTitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleLink = document.getElementById('toggleLink');
        const errorMessage = document.getElementById('errorMessage');

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            
            if (!isLoginMode) {
                authTitle.textContent = 'Create Psychologist Account';
                submitBtn.textContent = 'Create Account';
                nameGroup.classList.remove('d-none');
                licenseGroup.classList.remove('d-none');
                toggleLink.innerHTML = '<button type="button" class="btn btn-login">Back to Login</button>';
            } else {
                authTitle.textContent = 'Psychologist Login';
                submitBtn.textContent = 'Login';
                nameGroup.classList.add('d-none');
                licenseGroup.classList.add('d-none');
                toggleLink.innerHTML = '<button type="button" class="btn btn-register">Create Account</button>';
            }
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.classList.add('d-none');

            const email = emailEl.value.trim().toLowerCase();
            const password = passwordEl.value.trim();

            if (!email || !password) {
                showError('Please fill all required fields');
                return;
            }

            try {
                let endpoint, payload;

                if (isLoginMode) {
                    endpoint = '/api/login';
                    payload = { email, password };
                } else {
                    const name = nameEl.value.trim();
                    if (!name) {
                        showError('Please enter your name');
                        return;
                    }
                    endpoint = '/api/register';
                    payload = { email, password, name, user_type: 'psychologist' };
                }

                const res = await fetch(`${backendBase}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Authentication failed');
                }

                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userType', 'psychologist');
                    localStorage.setItem('userName', data.name);
                    window.location.href = 'psychologist-dashboard.html';
                } else {
                    throw new Error('No authentication token received');
                }
            } catch (e) {
                showError(e.message || 'An error occurred. Please try again.');
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.remove('d-none');
        }
    </script>
</body>
</html>

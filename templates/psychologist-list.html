<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Psychologists - MindCare Navigator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --primary-color: var(--mc-indigo, #6c77e8);
            --secondary-color: var(--mc-indigo-deep, #5560d6);
            --success-color: #2fa47c;
            --danger-color: #dc3545;
            --light-bg: var(--mc-lavender-soft, #eef0fd);
            --border-color: rgba(108, 119, 232, 0.18);
        }

        body {
            background: var(--mc-bg, #fafbff);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* Floating glass navigation */
        .navbar-wrap {
            position: sticky;
            top: 14px;
            z-index: 1030;
            padding: 0 16px;
        }

        .glass-navbar {
            background: rgba(255, 255, 255, 0.62);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(85, 96, 214, 0.10);
            padding: 10px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--mc-navy, #1f2b4d) !important;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar-brand .logo-orb {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #c7ccf9 35%, #8b93f0 70%, #6c77e8);
            box-shadow: 0 6px 16px rgba(108, 119, 232, 0.4);
            flex-shrink: 0;
        }

        .nav-link {
            color: var(--mc-slate, #52608a) !important;
            margin: 0 4px;
            font-weight: 500;
            border-radius: 999px;
            padding: 8px 16px;
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            color: var(--mc-indigo-deep, #5560d6) !important;
            background: rgba(165, 174, 245, 0.14);
        }

        .nav-link.nav-logout {
            color: var(--mc-indigo-deep, #5560d6) !important;
        }

        .page-head {
            text-align: center;
            padding: 56px 0 8px;
            padding-left: 20px;
            padding-right: 20px;
        }

        .header-title {
            color: var(--mc-navy, #1f2b4d);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .header-title .text-gradient {
            background: linear-gradient(120deg, #8b93f0, #5560d6 45%, #4fb3a9);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            color: var(--mc-slate, #52608a);
            font-size: 1.1rem;
            max-width: 560px;
            margin: 0 auto;
        }

        .container-main {
            max-width: 1200px;
        }

        /* Search / filter */
        .filter-section {
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            padding: 22px;
            border-radius: 22px;
            margin: 28px 0 12px;
            box-shadow: 0 10px 30px rgba(85, 96, 214, 0.08);
        }

        .filter-section .form-group-custom label {
            color: var(--mc-slate, #52608a);
        }

        .filter-section input {
            border: 1px solid rgba(108, 119, 232, 0.22);
            background: rgba(255, 255, 255, 0.8);
            padding: 12px 18px;
            border-radius: 999px;
            width: 100%;
            color: var(--mc-navy, #1f2b4d);
            transition: all 0.25s ease;
        }

        .filter-section input:focus {
            outline: none;
            border-color: var(--mc-indigo, #6c77e8);
            box-shadow: 0 0 0 4px rgba(108, 119, 232, 0.12);
        }

        /* Psychologist grid + cards */
        .psychologist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 24px;
            padding: 22px 0 10px;
        }

        .psychologist-card {
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 24px;
            overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
            box-shadow: 0 10px 30px rgba(85, 96, 214, 0.08);
        }

        .psychologist-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 45px rgba(85, 96, 214, 0.16);
        }

        .psychologist-card.offline {
            opacity: 0.72;
        }

        .psychologist-card .card-header {
            background: linear-gradient(135deg, rgba(139, 147, 240, 0.16), rgba(108, 197, 232, 0.14));
            padding: 26px 20px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
        }

        .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.75);
            color: var(--mc-slate, #52608a);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2fa47c;
            animation: pulse 2s infinite;
        }

        .status-badge.busy .dot {
            background: #e3a63a;
        }

        .status-badge.offline .dot {
            background: #adb5bd;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #c7ccf9 35%, #8b93f0 70%, #6c77e8);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 12px 28px rgba(108, 119, 232, 0.35);
        }

        .psychologist-name {
            color: var(--mc-navy, #1f2b4d);
            font-weight: 700;
            font-size: 1.15rem;
            margin-top: 6px;
        }

        .psychologist-card .card-body {
            padding: 20px 22px 22px;
        }

        .specialization {
            color: var(--mc-indigo-deep, #5560d6);
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 8px;
        }

        .bio {
            color: var(--mc-slate, #52608a);
            font-size: 0.9rem;
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .rating-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(108, 119, 232, 0.12);
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            color: var(--mc-navy, #1f2b4d);
        }

        .star {
            color: #e3a63a;
        }

        .experience {
            color: var(--mc-muted, #8a94b5);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .btn-start-chat {
            width: 100%;
            background: linear-gradient(135deg, #8b93f0 0%, #6c77e8 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 11px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(108, 119, 232, 0.25);
        }

        .btn-start-chat:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(108, 119, 232, 0.35);
            color: white;
            text-decoration: none;
        }

        .btn-start-chat:disabled {
            background: #d5d9e8;
            color: var(--mc-muted, #8a94b5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Empty state */
        .no-psychologists {
            background: rgba(255, 255, 255, 0.6);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            padding: 48px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(85, 96, 214, 0.08);
        }

        .no-psychologists i {
            font-size: 3rem;
            color: var(--mc-indigo, #6c77e8);
            margin-bottom: 20px;
        }

        .no-psychologists h3 {
            color: var(--mc-navy, #1f2b4d);
            margin-bottom: 10px;
        }

        .no-psychologists p {
            color: var(--mc-slate, #52608a);
        }

        /* Chat request modal */
        .chat-request-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(31, 43, 77, 0.35);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            z-index: 1050;
            align-items: center;
            justify-content: center;
        }

        .chat-request-modal.show {
            display: flex;
        }

        .modal-content-custom {
            background: rgba(255, 255, 255, 0.85);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 30px 80px rgba(31, 43, 77, 0.25);
            animation: modalIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(14px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header-custom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header-custom h2 {
            color: var(--mc-navy, #1f2b4d);
            font-weight: 700;
            font-size: 1.25rem;
            margin: 0;
        }

        .modal-close {
            background: rgba(165, 174, 245, 0.18);
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
            color: var(--mc-slate, #52608a);
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(165, 174, 245, 0.32);
            color: var(--mc-navy, #1f2b4d);
        }

        .form-group-custom {
            margin-bottom: 20px;
        }

        .form-group-custom label {
            display: block;
            margin-bottom: 8px;
            color: var(--mc-navy, #1f2b4d);
            font-weight: 600;
        }

        .form-group-custom textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(108, 119, 232, 0.22);
            background: rgba(255, 255, 255, 0.8);
            border-radius: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 110px;
            color: var(--mc-navy, #1f2b4d);
        }

        .form-group-custom textarea:focus {
            outline: none;
            border-color: var(--mc-indigo, #6c77e8);
            box-shadow: 0 0 0 4px rgba(108, 119, 232, 0.12);
        }

        .selected-psych-chip {
            padding: 12px 16px;
            background: rgba(165, 174, 245, 0.18);
            border: 1px solid rgba(108, 119, 232, 0.18);
            border-radius: 14px;
            color: var(--mc-indigo-deep, #5560d6);
            font-weight: 600;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-cancel {
            padding: 10px 22px;
            border: 1px solid rgba(108, 119, 232, 0.25);
            background: rgba(255, 255, 255, 0.7);
            color: var(--mc-slate, #52608a);
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.95);
            color: var(--mc-navy, #1f2b4d);
        }

        .btn-send-request {
            padding: 10px 24px;
            background: linear-gradient(135deg, #8b93f0 0%, #6c77e8 100%);
            color: white;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(108, 119, 232, 0.25);
        }

        .btn-send-request:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 26px rgba(108, 119, 232, 0.35);
        }

        .btn-send-request:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 575.98px) {
            .glass-navbar {
                border-radius: 22px;
            }
            .page-head {
                padding: 36px 0 4px;
            }
            .modal-content-custom {
                padding: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- Atmospheric background -->
    <div class="bg-atmosphere" aria-hidden="true">
        <div class="bg-noise"></div>
    </div>

    <!-- Navigation Bar -->
    <div class="navbar-wrap">
        <nav class="navbar navbar-expand-lg navbar-light glass-navbar">
            <div class="container-fluid p-0">
                <a class="navbar-brand" href="/"><span class="logo-orb" aria-hidden="true"></span>MindCare Navigator</a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="/chat"><i class="bi bi-chat-dots me-1"></i>AI Companion</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/community"><i class="bi bi-people me-1"></i>Community</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-logout" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

    <!-- Header Section -->
    <div class="page-head container">
        <h1 class="header-title">Find a <span class="text-gradient">Psychologist</span></h1>
        <p class="header-subtitle">Connect with professional mental health experts — real people, ready to listen when you need them.</p>
    </div>

    <!-- Main Content -->
    <div class="container container-main">
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="form-group-custom mb-0">
                <label for="searchInput"><i class="bi bi-search me-1"></i> Search by Name or Specialization</label>
                <input type="text" id="searchInput" placeholder="Enter psychologist name or specialization..." oninput="filterPsychologists()">
            </div>
        </div>

        <!-- Psychologists Grid -->
        <div id="psychologistsList" class="psychologist-grid"></div>

        <!-- No Psychologists Message -->
        <div id="noPsychologists" class="no-psychologists" style="display: none;">
            <i class="bi bi-inbox"></i>
            <h3>No Psychologists Available</h3>
            <p>Please check back later or contact support for assistance.</p>
        </div>
    </div>

    <!-- Chat Request Modal -->
    <div id="chatRequestModal" class="chat-request-modal">
        <div class="modal-content-custom">
            <div class="modal-header-custom">
                <h2>Start Chat Request</h2>
                <button class="modal-close" onclick="closeChatRequestModal()" aria-label="Close">&times;</button>
            </div>
            <form id="chatRequestForm" onsubmit="submitChatRequest(event)">
                <div class="form-group-custom">
                    <label>Psychologist</label>
                    <div class="selected-psych-chip" id="selectedPsychologistName"></div>
                </div>
                <div class="form-group-custom">
                    <label for="messageInput">Message (Optional)</label>
                    <textarea id="messageInput" placeholder="Tell the psychologist about your concern or reason for reaching out..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="closeChatRequestModal()">Cancel</button>
                    <button type="submit" class="btn-send-request" id="sendRequestBtn">
                        <span id="sendRequestText">Send Request</span>
                        <span id="sendRequestSpinner" class="loading" style="display: none; margin-left: 8px;"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Use the same origin as current page (no CORS issues)
        const backendBase = window.location.origin;
        let allPsychologists = [];
        let displayedPsychologists = [];
        let selectedPsychologist = null;

        // Get auth token
        function getAuthToken() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login';
                return null;
            }
            return token;
        }

        // Load psychologists on page load
        window.addEventListener('load', () => {
            const token = getAuthToken();
            if (token) {
                loadPsychologists();
                // Refresh every 30 seconds
                setInterval(loadPsychologists, 30000);
            }
        });

        // Load available psychologists
        async function loadPsychologists() {
            try {
                const token = getAuthToken();
                if (!token) return;

                const response = await fetch(`${backendBase}/api/psychologists/available`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Failed to load psychologists: ${response.status}`);
                }

                const data = await response.json();
                allPsychologists = data.psychologists || [];
                displayPsychologists(allPsychologists);
            } catch (error) {
                console.error('Error loading psychologists:', error);
                document.getElementById('psychologistsList').innerHTML = '';
                document.getElementById('noPsychologists').style.display = 'block';
            }
        }

        // Display psychologists in grid
        function displayPsychologists(psychologists) {
            const container = document.getElementById('psychologistsList');
            displayedPsychologists = psychologists || [];
            
            if (!psychologists || psychologists.length === 0) {
                container.innerHTML = '';
                document.getElementById('noPsychologists').style.display = 'block';
                return;
            }

            document.getElementById('noPsychologists').style.display = 'none';
            container.innerHTML = psychologists.map((psych, index) => {
                const status = (psych.status || 'available').toLowerCase();
                const isOffline = status === 'offline';
                const statusLabel = status.charAt(0).toUpperCase() + status.slice(1);

                return `
                <div class="psychologist-card ${isOffline ? 'offline' : ''}">
                    <div class="card-header">
                        <div class="status-badge ${status}">
                            <span class="dot"></span>
                            <span>${statusLabel}</span>
                        </div>
                        <div class="avatar">
                            <i class="bi bi-person-check"></i>
                        </div>
                        <div class="psychologist-name">${escapeHtml(psych.name || 'Psychologist')}</div>
                    </div>
                    <div class="card-body">
                        <div class="specialization">${escapeHtml(psych.specialization || 'General Counseling')}</div>
                        <div class="bio">${escapeHtml(psych.bio || 'Professional mental health expert')}</div>
                        <div class="rating-section">
                            <div class="rating">
                                <i class="bi bi-star-fill star"></i>
                                <span>${escapeHtml(psych.rating || '4.8')}</span>
                            </div>
                            <div class="experience">${escapeHtml(psych.experience || '5')} yrs exp</div>
                        </div>
                        <button class="btn-start-chat" ${isOffline ? 'disabled' : ''} onclick="openChatRequestByIndex(${index})">
                            <i class="bi ${isOffline ? 'bi-moon' : 'bi-chat-dots'}"></i> ${isOffline ? 'Offline' : 'Start Chat'}
                        </button>
                    </div>
                </div>
            `;
            }).join('');
        }

        // Filter psychologists
        function filterPsychologists() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPsychologists.filter(psych =>
                psych.name.toLowerCase().includes(searchTerm) ||
                psych.specialization.toLowerCase().includes(searchTerm)
            );
            displayPsychologists(filtered);
        }

        // Open chat request modal
        function openChatRequestByIndex(index) {
            const psych = displayedPsychologists[index];
            if (!psych) return;
            openChatRequestModal(psych.id, psych.name || 'Psychologist');
        }

        function openChatRequestModal(psychologistId, psychologistName) {
            const psych = allPsychologists.find(item => item.id === psychologistId);
            if (psych && (psych.status || '').toLowerCase() === 'offline') {
                alert(`${psychologistName} is currently offline. Please choose another psychologist or try again later.`);
                return;
            }

            selectedPsychologist = {
                id: psychologistId,
                name: psychologistName
            };
            document.getElementById('selectedPsychologistName').textContent = psychologistName;
            document.getElementById('messageInput').value = '';
            document.getElementById('chatRequestModal').classList.add('show');
        }

        // Close chat request modal
        function closeChatRequestModal() {
            document.getElementById('chatRequestModal').classList.remove('show');
            selectedPsychologist = null;
        }

        // Submit chat request
        async function submitChatRequest(event) {
            event.preventDefault();

            if (!selectedPsychologist) {
                alert('No psychologist selected');
                return;
            }

            const message = document.getElementById('messageInput').value;
            const sendRequestBtn = document.getElementById('sendRequestBtn');
            const sendRequestText = document.getElementById('sendRequestText');
            const sendRequestSpinner = document.getElementById('sendRequestSpinner');

            try {
                sendRequestBtn.disabled = true;
                sendRequestText.style.display = 'none';
                sendRequestSpinner.style.display = 'inline-block';

                const token = getAuthToken();
                if (!token) return;

                const response = await fetch(`${backendBase}/api/chat-request/send`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        psychologist_id: selectedPsychologist.id,
                        message: message
                    })
                });

                if (!response.ok) {
                    if (response.status === 409) {
                        const data = await response.json().catch(() => ({}));
                        throw new Error(data.error || 'This psychologist is currently offline');
                    }
                    throw new Error(`Failed to send request: ${response.status}`);
                }

                const data = await response.json();
                closeChatRequestModal();
                
                // Redirect to chat with the request ID
                window.location.href = `/psychologist-chat?requestId=${data.request_id}`;
            } catch (error) {
                console.error('Error sending chat request:', error);
                alert(error.message || 'Failed to send chat request. Please try again.');
                sendRequestBtn.disabled = false;
                sendRequestText.style.display = 'inline';
                sendRequestSpinner.style.display = 'none';
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userType');
            localStorage.removeItem('userName');
            window.location.href = '/login';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // Close modal when clicking outside
        document.getElementById('chatRequestModal').addEventListener('click', (e) => {
            if (e.target.id === 'chatRequestModal') {
                closeChatRequestModal();
            }
        });
    </script>
</body>
</html>

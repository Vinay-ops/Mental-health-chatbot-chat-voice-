<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MindCare Navigator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="static/css/style.css">
    <style>
        /* ---- Role Selector ---- */
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 22px;
        }
        .role-option {
            border: 2px solid rgba(165,174,245,0.3);
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
        }
        .role-option:hover {
            border-color: var(--mc-lavender);
            background: rgba(238,240,253,0.7);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108,119,232,0.12);
        }
        .role-option.selected {
            border-color: var(--mc-indigo);
            background: rgba(238,240,253,0.85);
            box-shadow: 0 4px 18px rgba(108,119,232,0.18);
        }
        .role-option i {
            font-size: 2rem;
            margin-bottom: 8px;
            display: block;
            color: var(--mc-indigo);
        }
        .role-option.selected i { color: var(--mc-indigo-deep); }
        .role-option p { margin: 0; font-size: 0.82rem; color: var(--mc-muted); }
        .role-option.selected p { color: var(--mc-slate); }
        /* ---- Auth Card ---- */
        .auth-card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: 28px;
            box-shadow: 0 18px 50px rgba(60,72,140,0.11), 0 2px 0 rgba(255,255,255,0.7) inset;
            padding: 2.6rem 2.8rem;
        }
        .auth-card .form-control {
            border: 1.5px solid rgba(165,174,245,0.35);
            border-radius: 12px;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.75);
            font-size: 0.95rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .auth-card .form-control:focus {
            border-color: var(--mc-indigo);
            box-shadow: 0 0 0 3px rgba(108,119,232,0.14);
            background: #fff;
        }
        .auth-card .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--mc-slate);
            margin-bottom: 6px;
        }
        .auth-heading {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--mc-navy);
            margin-bottom: 0.3rem;
        }
        .auth-sub {
            font-size: 0.9rem;
            color: var(--mc-muted);
            margin-bottom: 1.8rem;
        }
        .auth-bg {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body class="auth-bg">
    <!-- Atmospheric background -->
    <div class="bg-atmosphere" aria-hidden="true"><div class="bg-noise"></div></div>

    <!-- Floating Glass Navigation -->
    <div class="navbar-wrap">
        <nav class="glass-navbar" aria-label="Main navigation">
            <a class="navbar-logo" href="index.html">
                <span class="logo-orb" aria-hidden="true"></span>
                <span class="brand-text">MindCare Navigator</span>
            </a>

            <ul class="nav-pills-glass d-none d-lg-flex mx-auto">
                <li><a class="nav-pill-link" href="index.html">Home</a></li>
                <li><a class="nav-pill-link" href="chat.html">AI Companion</a></li>
                <li><a class="nav-pill-link" href="psychologist-list.html">Psychologists</a></li>
                <li><a class="nav-pill-link" href="community.html">Community</a></li>
            </ul>

            <div class="nav-actions">
                <select class="lang-select d-none d-sm-block" id="lang-selector" aria-label="Language">
                    <option value="en">English</option>
                    <option value="hi">हिन्दी</option>
                    <option value="mr">मराठी</option>
                </select>
                <a class="btn btn-glass btn-sm px-3 py-2" href="login.html">Login</a>
                <a class="btn btn-gradient btn-sm px-3 py-2 active" href="register.html">Register</a>
            </div>
        </nav>
    </div>

    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7 col-xl-6">
                <div class="auth-card">
                    <p class="auth-heading">Create Account ✨</p>
                    <p class="auth-sub">Join MindCare Navigator and start your wellness journey today.</p>

                    <!-- Role Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-bold mb-3" style="font-size:0.9rem; color:var(--mc-navy);">I am a...</label>
                        <div class="role-selector">
                            <div class="role-option selected" onclick="selectRole('user')" id="userRole">
                                <i class="bi bi-person-heart"></i>
                                <strong>User</strong>
                                <p>Seeking support</p>
                            </div>
                            <div class="role-option" onclick="selectRole('psychologist')" id="psychologistRole">
                                <i class="bi bi-stethoscope"></i>
                                <strong>Psychologist</strong>
                                <p>Providing care</p>
                            </div>
                        </div>
                    </div>

                    <!-- Registration Form -->
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name" autocomplete="off" placeholder="Your full name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" autocomplete="off" placeholder="you@example.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="••••••••">
                    </div>
                    <div class="text-danger small d-none mb-2" id="error"></div>
                    <button class="btn btn-gradient w-100 mt-2" id="submit" style="padding: 0.75rem; border-radius: 12px; font-size: 1rem;">
                        <i class="bi bi-person-plus me-2"></i>Create Account
                    </button>
                    <p class="text-center mt-3 mb-0" style="font-size:0.88rem; color:var(--mc-muted);">
                        Already have an account?
                        <a href="login.html" class="fw-700" style="color:var(--mc-indigo); font-weight:700;">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const backendBase = 'http://127.0.0.1:8002';
        let selectedRole = 'user'; // Default role
        
        const nameEl = document.getElementById('name');
        const emailEl = document.getElementById('email');
        const passwordEl = document.getElementById('password');
        const submitEl = document.getElementById('submit');
        const errorEl = document.getElementById('error');

        // Role selection handler
        function selectRole(role) {
            selectedRole = role;
            
            // Update UI
            document.getElementById('userRole').classList.remove('selected');
            document.getElementById('psychologistRole').classList.remove('selected');
            
            if (role === 'user') {
                document.getElementById('userRole').classList.add('selected');
            } else {
                document.getElementById('psychologistRole').classList.add('selected');
            }
        }

        async function doRegister() {
            const name = (nameEl.value || '').trim();
            const email = (emailEl.value || '').trim();
            const password = (passwordEl.value || '').trim();
            
            if (!name || !email || !password) {
                errorEl.textContent = 'Please fill all fields';
                errorEl.classList.remove('d-none');
                return;
            }
            
            try {
                const res = await fetch(`${backendBase}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name, 
                        email, 
                        password,
                        user_type: selectedRole  // Include role
                    })
                });
                
                if (!res.ok) throw new Error('Register failed');
                const data = await res.json();
                
                if (data.token) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userType', selectedRole);
                    localStorage.setItem('userName', data.name);
                    
                    // Redirect based on role
                    if (selectedRole === 'psychologist') {
                        window.location.href = 'psychologist-dashboard.html';
                    } else {
                        window.location.href = 'chat.html';
                    }
                } else {
                    throw new Error('No token');
                }
            } catch (e) {
                errorEl.textContent = e.message || 'Registration failed. Please try again.';
                errorEl.classList.remove('d-none');
            }
        }
        
        submitEl.addEventListener('click', doRegister);
        passwordEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') doRegister(); });
    </script>
</body>
</html>
